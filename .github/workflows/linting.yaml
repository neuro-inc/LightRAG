name: Linting and Formatting

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint-and-format:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.x'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                APP_TYPES_VERSION=$(grep -A1 '^name = "apolo-app-types"$' poetry.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
                pip install pre-commit "apolo-app-types==${APP_TYPES_VERSION:?not found in poetry.lock}"

            - name: Run pre-commit
              run: pre-commit run --all-files --show-diff-on-failure
